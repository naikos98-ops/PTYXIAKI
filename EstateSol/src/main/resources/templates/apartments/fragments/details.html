<div th:fragment="details">

    <input type="hidden" id="aptId" th:value="${apartment.id}"/>

    <div>
        <label>Περιοχή</label>
        <input type="text" id="area" th:value="${apartment.area}">
    </div>

    <div>
        <label>Τετραγωνικά</label>
        <input type="number" id="sqm" th:value="${apartment.squareMeters}">
    </div>

    <div>
        <label>Όροφος</label>
        <input type="number" id="floor" th:value="${apartment.floor}">
    </div>

    <div>
        <label>Κατάσταση</label>
        <input type="text" id="condition" th:value="${apartment.condition}">
    </div>

    <!-- PRICES -->
    <div th:if="${apartment.aiProcessed}">
    	<div sec:authorize="hasRole('ADMIN')">

		<label>Ενοίκιο</label>
	       <input type="number" step="0.01" id="rentInput"
           th:value="${apartment.estimatedRent}">
           
		<label>Πώληση</label>
	    <input type="number" step="0.01" id="saleInput"
	           th:value="${apartment.estimatedPrice}">
	
	    <button onclick="updatePricesAjax()">Αποθήκευση</button>
				 <div id="priceStatus" style="margin-top:8px;"></div>
	</div>
    
    
    <div sec:authorize="hasRole('USER')">
        <p>Ενοίκιο: <strong th:text="${apartment.estimatedRent}"></strong> €</p>
        <p>Πώληση: <strong th:text="${apartment.estimatedPrice}"></strong> €</p>
    </div>
    </div>

    <div th:if="${!apartment.aiProcessed}">
        <div class="spinner-border text-primary" role="status">
		  <span class="sr-only">Loading...</span>
		</div>
    </div>

    <hr>

    <!-- IMAGES (ΠΟΤΕ ΜΕΣΑ ΣΕ aiProcessed IF) -->
    <div>
        <h3>Original Image</h3> 
        <img th:src="@{'/' + ${apartment.imagePath}}" width="300"/>
    </div>

    <div th:if="${apartment.renovatedImagePath != null}">
        <h3>Renovated Image</h3>
        <img th:src="@{'/' + ${apartment.renovatedImagePath}}" width="300"/>
    </div>

    <hr>

    <!-- BUTTONS (ΠΟΤΕ ΜΕΣΑ ΣΕ aiProcessed IF) -->
    <button onclick="saveApartment()">Αποθήκευση νέων στοιχείων</button>
    <div id="saveStatus" style="margin-top:10px;"></div>

    <br>

    <button onclick="deleteApartment()" style="margin-left:10px;color:red;">
        Διαγραφή
    </button>
    <div id="deleteStatus" style="margin-top:10px;"></div>

</div>

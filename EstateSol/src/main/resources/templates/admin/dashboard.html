<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Admin Dashboard</title>
    
  <!--    <meta name="_csrf" th:content="${_csrf.token}"/>
	<meta name="_csrf_header" th:content="${_csrf.headerName}"/> -->

    <meta charset="UTF-8">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #8399A8;
        }

        .layout {
            display: flex;
            gap: 20px;
        }

        .left {
            width: 30%;
            border-right: 1px solid #ccc;
        }

        .right {
            width: 70%;
        }

        .box {
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
        }

        .apartment-row {
            border-bottom: 1px solid #eee;
            padding: 5px;
            cursor: pointer;
        }

        .apartment-row:hover {
            background-color: #f5f5f5;
        }
        
		.user-panel {
		    max-height: 350px;        
		    overflow-y: auto;         
		    border: 1px solid #ccc;
		    padding: 10px;
		    background: #fafafa;
		}
		.user-row {
		    padding: 8px;
		    border-bottom: 1px solid #ddd;
		}
		.user-row:last-child {
		    border-bottom: none;
		}
    </style>
</head>

<body>

<h1>Admin Dashboard</h1>

<p>
    Logged in as:
    <strong sec:authentication="name"></strong>
</p>

<form th:action="@{/logout}" method="post">
    <button type="submit">Logout</button>
</form>

<hr>

<div class="layout">
<button onclick="loadCreateForm()">+ Νέο Διαμέρισμα</button>

    <!-- LEFT: LIST -->
    <div class="left box">
        <h3>All Apartments</h3>

        <div id="apartmentList">
            <!-- AJAX: apartment list -->
            <em>Loading apartments...</em>
        </div>
    </div>

    <!-- RIGHT: DETAILS / EDIT -->
    <div class="right box">
        <h3>Apartment Details</h3>

        <div id="apartmentDetails">
            <!-- AJAX: selected apartment -->
            <em>Select an apartment</em>
        </div>
    </div>

</div>

<hr>

<hr>

<div sec:authorize="hasRole('ADMIN')">
    <h2>Users</h2>

    <div class="user-panel">

        <div th:each="user : ${users}" class="user-row">

            <input type="hidden" th:value="${user.id}" class="userId"/>

            <label>Username:</label>
            <input type="text"
                   th:value="${user.username}"
                   class="usernameInput"/>

            <button onclick="updateUsername(this)">Αποθήκευση</button>

            <button onclick="deleteUser(this)"
                    style="margin-left:10px;color:red;">
                Διαγραφή
            </button>

            <div class="userStatus" style="margin-top:5px;"></div>
        </div>

    </div>
</div>

<hr>

<div sec:authorize="hasRole('ADMIN')">
    <h3>Δημιουργία Χρήστη</h3>

    <input type="text" id="newUsername" placeholder="Username">
    <br>

    <input type="password" id="newPassword" placeholder="Password">
    <br>

    <label>
        <input type="checkbox" id="isAdmin">
        Δημιουργία ως Admin
    </label>

    <br><br>

    <button onclick="createUser()">Δημιουργία</button>

    <div id="createUserStatus" style="margin-top:10px;"></div>
</div>


<script>

	function loadCreateForm() {
	    $("#apartmentDetails").load("/apartments/createFragment");
	}

	function loadApartments() {
    	$("#apartmentList").load("/apartments/allFragments");
	}
	
	const csrfToken = $("meta[name='_csrf']").attr("content");
    const csrfHeader = $("meta[name='_csrf_header']").attr("content");
	

	function saveApartment() {
	    const id = $("#aptId").val();
	
	    $.post("/apartments/" + id + "/ajax", {
	    	area: $("#area").val(),
	        squareMeters: $("#sqm").val(),
	        floor: $("#floor").val(),
	        condition: $("#condition").val()
	    })
	    .done(function () {
	        $("#saveStatus").text("Αποθηκεύτηκε ✔").css("color", "green");
	        loadApartments(); // refresh list (αριστερά) 
	    })
	    .fail(function (xhr) {
	        $("#saveStatus").text("Σφάλμα: " + xhr.status).css("color", "red");
	    });
}

	$(document).on("click", ".apartment-row", function () {
	    const id = $(this).data("id");
	    $("#apartmentDetails").load("/apartments/" + id + "/detailsFragment");
	});
	
	$(document).ready(function () {
	    loadApartments();
	});

	function deleteApartment() {
	    const id = $("#aptId").val();
	
	    if (!confirm("Είσαι σίγουρος ότι θες να διαγράψεις το διαμέρισμα;")) {
	        return;
	    }
	
	    $.post("/apartments/" + id + "/deleteajax")
	        .done(function () {
	            $("#deleteStatus").text("Διαγράφηκε ✔").css("color", "green");
	            $("#apartmentDetails").html("<em>Επιλέξτε διαμέρισμα</em>");
	            loadApartments();
	        })
	        .fail(function (xhr) {
	            $("#deleteStatus").text("Σφάλμα: " + xhr.status).css("color", "red");
	        });
	}
	
	function createApartment() {

	    const formData = new FormData();
	    formData.append("area", $("#area").val());
	    formData.append("squareMeters", $("#sqm").val());
	    formData.append("floor", $("#floor").val());
	    formData.append("condition", $("#condition").val());
	    formData.append("image", $("#image")[0].files[0]);

	    // 🔑 ΚΡΙΣΙΜΟ
	    formData.append("_csrf", csrfToken);

	    $.ajax({
	        url: "/apartments/ajax",
	        type: "POST",
	        data: formData,
	        processData: false,
	        contentType: false
	    })
	    .done(function () {
	        $("#createStatus").text("Δημιουργήθηκε ✔").css("color", "green");
	        loadApartments();
	    })
	    .fail(function (xhr) {
	        $("#createStatus").text("Σφάλμα: " + xhr.status).css("color", "red");
	    });
	}
	
	function updatePricesAjax() {
	    const id = document.getElementById("aptId").value;
	    const rent = document.getElementById("rentInput").value;
	    const sale = document.getElementById("saleInput").value;

	    fetch(`/admin/apartments/${id}/prices`, {
	        method: "POST",
	        headers: {
	            "Content-Type": "application/x-www-form-urlencoded"
	        },
	        body: new URLSearchParams({
	            rent: rent,
	            sale: sale
	        })
	    })
	    .then(res => {
	        if (!res.ok) throw new Error();
	        document.getElementById("priceStatus").innerText =
	            "✔ Οι τιμές αποθηκεύτηκαν";
	    })
	    .catch(() => {
	        document.getElementById("priceStatus").innerText =
	            "❌ Σφάλμα αποθήκευσης";
	    });
	}
	
	function updateUsername(button) {
	    const container = button.closest("div");
	    const userId = container.querySelector(".userId").value;
	    const username = container.querySelector(".usernameInput").value;
	    const status = container.querySelector(".userStatus");

	    fetch(`/admin/users/${userId}/username`, {
	        method: "POST",
	        headers: {
	            "Content-Type": "application/x-www-form-urlencoded"
	        },
	        body: new URLSearchParams({
	            username: username
	        })
	    })
	    .then(res => {
	        if (!res.ok) throw new Error();
	        status.innerText = "✔ Username ενημερώθηκε";
	    })
	    .catch(() => {
	        status.innerText = "❌ Σφάλμα";
	    });
	}

	function deleteUser(button) {
	    const container = button.closest("div");
	    const userId = container.querySelector(".userId").value;
	    const status = container.querySelector(".userStatus");

	    if (!confirm("Σίγουρα θέλεις να διαγράψεις τον χρήστη;")) return;

	    fetch(`/admin/users/${userId}`, {
	        method: "DELETE"
	    })
	    .then(res => {
	        if (!res.ok) throw new Error();
	        container.remove();
	    })
	    .catch(() => {
	        status.innerText = "❌ Αποτυχία διαγραφής";
	    });
	}
	
	function createUser() {
	    const username = document.getElementById("newUsername").value;
	    const password = document.getElementById("newPassword").value;
	    const admin = document.getElementById("isAdmin").checked;
	    const status = document.getElementById("createUserStatus");

	    if (!username || !password) {
	        status.innerText = "❌ Συμπλήρωσε όλα τα πεδία";
	        return;
	    }

	    fetch("/admin/users", {
	        method: "POST",
	        headers: {
	            "Content-Type": "application/x-www-form-urlencoded"
	        },
	        body: new URLSearchParams({
	            username: username,
	            password: password,
	            admin: document.getElementById("isAdmin").checked
	        })
	    })
	    .then(async res => {
	        if (res.ok) {
	            status.innerText = "✔ Ο χρήστης δημιουργήθηκε";
	            status.style.color = "green";
	            return;
	        }

	        const error = await res.text();

	        if (error === "USERNAME_EXISTS") {
	            status.innerText = "❌ Το username υπάρχει ήδη";
	        } else {
	            status.innerText = "❌ Σφάλμα συστήματος";
	        }

	        status.style.color = "red";
	    })
	    .catch(() => {
	        status.innerText = "❌ Αποτυχία επικοινωνίας";
	        status.style.color = "red";
	    });
	}


</script>

</body>
</html>
